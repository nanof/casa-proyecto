<style>
:root{--bg:#eef0ee;--card:#fff;--ink:#1c2228;--muted:#5b646d;--line:#d7dbd7;--accent:#b0502a}

async function open_(pw){
  const bk=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},bk,{name:"AES-GCM",length:256},false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
  document.open();document.write(html);document.close();
}
const f=document.getElementById("f"),b=document.getElementById("b"),e=document.getElementById("err");
let saved=null;try{saved=localStorage.getItem("casa_pw")}catch(_){}

f.addEventListener("submit",async ev=>{ev.preventDefault();b.disabled=true;e.textContent="";const pw=document.getElementById("pw").value,rem=document.getElementById("rem").checked;
