<style>
:root{--bg:#eef0ee;--card:#fff;--ink:#1c2228;--muted:#5b646d;--line:#d7dbd7;--accent:#b0502a}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;padding:16px}

input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink)}
button{font:inherit;font-size:16px;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}#err{color:#c0392b;min-height:1.2em}
</style></head><body>
